name: UI smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'db/**'
      - 'tests/ui/**'
      - 'package*.json'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned browser tooling outside the application dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/ui-tools" --no-package-lock --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/ui-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Production build with an isolated build database
        run: DATABASE_PATH=:memory: npm run build
      - name: Exercise the real app on a disposable database
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/ui-tools/node_modules/playwright" node tests/ui/smoke.mjs
      - name: Save browser screenshots and checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-ui-evidence
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 14
