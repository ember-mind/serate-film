name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }} (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [test, build, audit]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build workers must never migrate a shared or production database.
      DATABASE_PATH: ":memory:"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly the committed dependency tree
        run: npm ci
      - name: Run regression tests
        if: matrix.check == 'test'
        run: npm test
      - name: Build the production application
        if: matrix.check == 'build'
        run: npm run build
      - name: Check production dependency advisories
        if: matrix.check == 'audit'
        run: npm audit --omit=dev --audit-level=high
